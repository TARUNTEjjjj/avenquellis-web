name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist/offline-assets.json dist/sw.js
      # Uses the runner's installed Chrome; playwright-core downloads no browser.
      - name: Check pending submissions in Chrome
        run: |
          npm install --no-save playwright-core@1.62.1
          node tests/submission-browser.mjs
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
